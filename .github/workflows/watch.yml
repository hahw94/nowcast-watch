# 공개 사이트 갱신 감시 → 텔레그램 (2026-10-31). 10분마다(GitHub 사정으로 몇 분 늦을 수 있음), 손으로도 돌릴 수 있음(시험 알림 고르기).
# 상태(state.json)는 main 이 아니라 state 브랜치에 저장(main 에 봇 커밋이 쌓이지 않게, 2026-10-31)
name: site-watch
on:
  schedule:
    - cron: "6,16,26,36,46,56 * * * *"         # 10분마다(연구자 계정으로 등록, 2026-10-31)
  push:                                         # 감시 코드 · 설정을 바꿔 올리면 시험 알림 한 번(바뀐 문구 확인용, 2026-10-31)
    branches: [main]
    paths: [check.py, .github/workflows/watch.yml]
  workflow_dispatch:
    inputs:
      test:
        description: "시험 알림 보내기(폰으로 한 번)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: site-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: load state
        run: |
          if git fetch --depth 1 origin state:state; then
            git checkout state -- state.json
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ (inputs.test || github.event_name == 'push') && '1' || '0' }}
        run: python check.py
      - name: save state
        run: |
          if git rev-parse -q --verify state >/dev/null && git diff --quiet state -- state.json; then exit 0; fi   # 바뀐 게 없으면 올리지 않음
          git config user.name "site-watch-bot"
          git config user.email "site-watch-bot@users.noreply.github.com"
          cp state.json /tmp/state.json
          git checkout --orphan state-new
          git rm -rfq --cached .
          cp /tmp/state.json state.json
          git add state.json
          git commit -qm "감시 상태 갱신"
          git push -fq origin state-new:state
