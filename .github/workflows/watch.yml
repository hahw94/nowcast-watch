# 공개 사이트 갱신 감시 → 텔레그램 (2026-10-31). 10분마다(GitHub 사정으로 몇 분 늦을 수 있음), 손으로도 돌릴 수 있음(시험 알림 고르기).
name: site-watch
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"         # 정각(:00)은 GitHub 이 붐벼 건너뛰는 일이 많아 3분 비켜 둠(2026-10-31)
  push:                                         # 감시 코드 · 설정을 바꿔 올리면 시험 알림 한 번(바뀐 문구 확인용, 2026-10-31)
    branches: [main]
    paths: [check.py, .github/workflows/watch.yml]
  workflow_dispatch:
    inputs:
      test:
        description: "시험 알림 보내기(폰으로 한 번)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: site-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ (inputs.test || github.event_name == 'push') && '1' || '0' }}
        run: python check.py
      - name: save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "site-watch-bot"
            git config user.email "site-watch-bot@users.noreply.github.com"
            git add state.json && git commit -m "감시 상태 갱신" && git push
          fi
